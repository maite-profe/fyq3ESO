<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tema 2 · Disoluciones y mezclas · FyQ 3.º ESO</title><style>
*{box-sizing:border-box}body{margin:0;background:#081d35;color:white;font-family:system-ui,Arial,sans-serif;overflow:hidden}.slide{display:none;position:relative;width:100vw;height:100dvh;align-items:center;justify-content:center;padding:12px 12px 72px}.slide.active{display:flex}.visual{position:relative;width:min(calc((100dvh - 90px)*16/9),calc(100vw - 24px));aspect-ratio:16/9;background-image:url('./guia-visual.png');background-repeat:no-repeat;background-color:white;border-radius:12px;box-shadow:0 15px 60px #0008;overflow:hidden}.r1{background-size:300% 300%}.r3{background-size:400% 300%}.logo-cover{position:absolute;left:2.5%;top:2%;width:31%;height:15%;background:#f4fbff;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#124071;font-weight:850;font-size:clamp(13px,2vw,29px);line-height:1.08;text-align:center;box-shadow:0 1px 5px #0002}.logo-cover small{display:block;font-size:.5em;font-weight:600;margin-top:4px}.controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:#102c4eeb;border:1px solid #507ca3;border-radius:30px;padding:7px 15px;z-index:10}button{border:0;border-radius:20px;background:#f18a36;color:#172b42;font-size:17px;font-weight:800;padding:9px 18px;cursor:pointer}button:disabled{opacity:.35;cursor:default}#count{font-size:15px;min-width:74px;text-align:center}.note{position:absolute;top:10px;right:20px;background:#143c64e8;padding:7px 12px;border-radius:12px;font-size:13px}@media(max-width:650px){.slide{padding:5px 5px 65px}.visual{width:calc(100vw - 10px)}.controls{gap:7px}button{font-size:14px;padding:8px 12px}.logo-cover{font-size:11px}}
</style></head><body><main id="slides"></main><nav class="controls" aria-label="Navegación"><button id="home" aria-label="Ir al índice">⌂</button><button id="prev">← Anterior</button><span id="count"></span><button id="next">Siguiente →</button></nav><script>
const coords=[['r1','0% 0%'],['r1','50% 0%'],['r1','100% 0%'],['r1','0% 50%'],['r1','50% 50%'],['r1','100% 50%'],['r3','0% 100%'],['r3','33.333% 100%'],['r3','66.667% 100%'],['r3','100% 100%']];
const titles=['Portada e índice','Actividad inicial: cuatro vasos','Sustancias puras y mezclas','Clasificación de la materia','Juego: clasifica la materia','¿Qué es una disolución?','Suspensiones','Coloides','Aleaciones y amalgamas','¿Qué debemos saber?'];
document.getElementById('slides').innerHTML=coords.map((p,i)=>'<section class="slide'+(i===0?' active':'')+'" aria-label="'+titles[i]+'"><div class="visual '+p[0]+'" style="background-position:'+p[1]+'">'+(i===0?'<div class="logo-cover">COLEGIO PUNTA GALEA<small>Física y Química · 3.º ESO</small></div>':'')+'</div></section>').join('');
let current=0;const slides=[...document.querySelectorAll('.slide')];function go(i){current=Math.max(0,Math.min(slides.length-1,i));slides.forEach((s,j)=>s.classList.toggle('active',j===current));document.getElementById('count').textContent=(current+1)+' / '+slides.length;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1}document.getElementById('home').onclick=()=>go(0);document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1);if(e.key==='Home')go(0)});go(0);
</script></body></html>
